<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How Aquilvyn makes a call</title>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#dcfce7"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef2f2"/><stop offset="1" stop-color="#fee2e2"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  </defs>

  <rect width="1400" height="660" rx="18" fill="#ffffff"/>

  <!-- ============ ① DATA IN ============ -->
  <text x="24" y="28" font-size="15" font-weight="700" fill="#0f172a">① Data in</text>
  <g font-size="13" fill="#0f172a">
    <!-- card: prices -->
    <g filter="url(#sh)"><rect x="20" y="40" width="320" height="118" rx="12" fill="#fff7ed" stroke="#fdba74"/></g>
    <line x1="112" y1="52" x2="112" y2="146" stroke="#fed7aa"/>
    <text x="66" y="92" font-size="28" text-anchor="middle">📈</text>
    <text x="66" y="122" font-size="13" font-weight="700" text-anchor="middle">Prices</text>
    <g font-size="12">
      <rect x="124" y="54" width="100" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="174" y="72" text-anchor="middle" font-weight="700" fill="#6d28d9">Yahoo Finance</text>
      <rect x="232" y="54" width="96" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="280" y="72" text-anchor="middle" font-weight="700" fill="#1d4ed8">NSE · BSE</text>
      <rect x="124" y="88" width="204" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="226" y="106" text-anchor="middle" font-weight="700" fill="#0f766e">AMFI · mfapi.in (fund NAVs)</text>
      <text x="124" y="138" fill="#64748b">live quotes · 200+ days of history</text>
    </g>

    <!-- card: fundamentals -->
    <g filter="url(#sh)"><rect x="20" y="168" width="320" height="118" rx="12" fill="#fff7ed" stroke="#fdba74"/></g>
    <line x1="112" y1="180" x2="112" y2="274" stroke="#fed7aa"/>
    <text x="66" y="220" font-size="28" text-anchor="middle">🏢</text>
    <text x="66" y="250" font-size="13" font-weight="700" text-anchor="middle">Fundamentals</text>
    <g font-size="12">
      <rect x="124" y="182" width="64" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="156" y="200" text-anchor="middle" font-weight="700" fill="#6d28d9">Yahoo</text>
      <rect x="194" y="182" width="82" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="235" y="200" text-anchor="middle" font-weight="700" fill="#0369a1">Screener.in</text>
      <rect x="282" y="182" width="46" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="305" y="200" text-anchor="middle" font-weight="700" fill="#1d4ed8">NSE</text>
      <rect x="124" y="216" width="204" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="226" y="234" text-anchor="middle" font-weight="700" fill="#b45309">Finnhub · Alpha Vantage (opt.)</text>
      <text x="124" y="266" fill="#64748b">P/E · ROE · debt · growth · margins</text>
    </g>

    <!-- card: your statements -->
    <g filter="url(#sh)"><rect x="20" y="296" width="320" height="118" rx="12" fill="#fff7ed" stroke="#fdba74"/></g>
    <line x1="112" y1="308" x2="112" y2="402" stroke="#fed7aa"/>
    <text x="66" y="348" font-size="28" text-anchor="middle">📄</text>
    <text x="66" y="378" font-size="13" font-weight="700" text-anchor="middle">Your holdings</text>
    <g font-size="12">
      <rect x="124" y="310" width="96" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="172" y="328" text-anchor="middle" font-weight="700" fill="#15803d">Any broker</text>
      <rect x="226" y="310" width="102" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="277" y="328" text-anchor="middle" font-weight="700" fill="#15803d">CAMS · KFin CAS</text>
      <rect x="124" y="344" width="46" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="147" y="362" text-anchor="middle" font-weight="700" fill="#15803d">NPS</text>
      <rect x="176" y="344" width="80" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="216" y="362" text-anchor="middle" font-weight="700" fill="#15803d">NSDL eCAS</text>
      <rect x="262" y="344" width="66" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="295" y="362" text-anchor="middle" font-weight="700" fill="#15803d">Tax P&amp;L</text>
      <text x="124" y="394" fill="#64748b">lots · cost · intent · tax status</text>
    </g>

    <!-- card: market mood -->
    <g filter="url(#sh)"><rect x="20" y="424" width="320" height="118" rx="12" fill="#fff7ed" stroke="#fdba74"/></g>
    <line x1="112" y1="436" x2="112" y2="530" stroke="#fed7aa"/>
    <text x="66" y="476" font-size="28" text-anchor="middle">🌡️</text>
    <text x="66" y="506" font-size="13" font-weight="700" text-anchor="middle">Market mood</text>
    <g font-size="12">
      <rect x="124" y="438" width="120" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="184" y="456" text-anchor="middle" font-weight="700" fill="#7c3aed">Nifty vs 200-DMA</text>
      <rect x="250" y="438" width="78" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="289" y="456" text-anchor="middle" font-weight="700" fill="#7c3aed">India VIX</text>
      <rect x="124" y="472" width="204" height="26" rx="13" fill="#fff" stroke="#e5e7eb"/><text x="226" y="490" text-anchor="middle" font-weight="700" fill="#7c3aed">Bull · Correction · Bear</text>
      <text x="124" y="522" fill="#64748b">E36 regime: how bold to be</text>
    </g>
  </g>

  <!-- readiness strip under data -->
  <rect x="20" y="556" width="320" height="44" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-dasharray="5 4"/>
  <text x="180" y="575" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle">🔄 Readiness engine (E44)</text>
  <text x="180" y="592" font-size="11.5" fill="#0f766e" text-anchor="middle">re-fetches stale data every 15 min, by itself</text>

  <!-- merge arrows data → analysis -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M340 99 H356 V300"/><path d="M340 227 H356"/><path d="M340 355 H356"/><path d="M340 483 H356 V300"/>
    <path d="M356 300 H378" marker-end="url(#ak)" stroke="#64748b"/>
  </g>

  <!-- ============ ② ANALYSIS TEAM ============ -->
  <text x="390" y="28" font-size="15" font-weight="700" fill="#0f172a">② Analysis engines</text>
  <g filter="url(#sh)"><rect x="384" y="40" width="236" height="560" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/></g>
  <rect x="384" y="560" width="236" height="40" rx="0" fill="#f59e0b"/>
  <path d="M384 560 H620 V586 a14 14 0 0 1 -14 14 H398 a14 14 0 0 1 -14 -14 z" fill="#f59e0b"/>
  <text x="502" y="585" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Analysis team · E12–E20</text>

  <!-- strengths -->
  <rect x="404" y="58" width="196" height="196" rx="12" fill="url(#gGreen)" stroke="#86efac" stroke-width="1.5"/>
  <text x="502" y="98" font-size="30" text-anchor="middle">📗</text>
  <text x="502" y="130" font-size="20" font-weight="800" fill="#16a34a" text-anchor="middle">Strengths</text>
  <g font-size="12" fill="#166534" text-anchor="middle">
    <text x="502" y="160">quality business (score ≥ 65)</text>
    <text x="502" y="180">healthy uptrend</text>
    <text x="502" y="200">fell only with the market</text>
    <text x="502" y="220">price has stabilised</text>
    <text x="502" y="240">cheap vs its own history</text>
  </g>

  <!-- drawdown sentinel -->
  <line x1="470" y1="262" x2="470" y2="344" stroke="#94a3b8" stroke-width="2" marker-end="url(#ak)"/>
  <line x1="534" y1="344" x2="534" y2="262" stroke="#94a3b8" stroke-width="2" marker-end="url(#ak)"/>
  <rect x="412" y="282" width="180" height="42" rx="21" fill="#fef3c7" stroke="#d97706"/>
  <text x="502" y="300" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">E20 Drawdown Sentinel</text>
  <text x="502" y="316" font-size="11" fill="#92400e" text-anchor="middle">market · sector · or the company?</text>

  <!-- warnings -->
  <rect x="404" y="352" width="196" height="196" rx="12" fill="url(#gRed)" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="502" y="392" font-size="30" text-anchor="middle">📕</text>
  <text x="502" y="424" font-size="20" font-weight="800" fill="#dc2626" text-anchor="middle">Warnings</text>
  <g font-size="12" fill="#991b1b" text-anchor="middle">
    <text x="502" y="454">investment case broken</text>
    <text x="502" y="474">weak business + weak trend</text>
    <text x="502" y="494">stop-loss hit</text>
    <text x="502" y="514">over the position cap</text>
    <text x="502" y="534">costly Regular-plan fund</text>
  </g>

  <!-- evidence arrows -->
  <path d="M600 150 H700 V256" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="612" y="140" font-size="13" font-weight="700" fill="#16a34a">Buy evidence</text>
  <path d="M600 450 H700 V352" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="612" y="441" font-size="13" font-weight="700" fill="#dc2626">Sell evidence</text>

  <!-- ============ ③ RULEBOOK (the trader) ============ -->
  <g filter="url(#sh)"><rect x="640" y="258" width="130" height="92" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/></g>
  <text x="705" y="292" font-size="26" text-anchor="middle">⚖️</text>
  <text x="705" y="318" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">Rulebook</text>
  <text x="705" y="337" font-size="11" fill="#1e40af" text-anchor="middle">E21 · + confidence</text>
  <text x="705" y="248" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">③ Decide</text>

  <!-- data gate note -->
  <rect x="624" y="478" width="162" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="705" y="499" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">🚧 Data gate first</text>
  <text x="705" y="516" font-size="11" fill="#64748b" text-anchor="middle">no history or fundamentals</text>
  <text x="705" y="530" font-size="11" fill="#64748b" text-anchor="middle">→ "Hold · data missing"</text>

  <!-- rulebook → risk -->
  <path d="M770 280 H830 V140 H858" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ak)"/>
  <text x="840" y="214" font-size="12.5" font-weight="600" fill="#475569" transform="rotate(-90 840 214)" text-anchor="middle">Proposed call</text>

  <!-- ============ ④ RISK & TAX ============ -->
  <text x="870" y="28" font-size="15" font-weight="700" fill="#0f172a">④ Risk &amp; tax checks</text>
  <g filter="url(#sh)"><rect x="862" y="40" width="226" height="236" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/></g>
  <g font-size="13" fill="#1e1b4b">
    <rect x="878" y="56" width="194" height="34" rx="8" fill="#fff" stroke="#e0e7ff"/><rect x="886" y="63" width="20" height="20" rx="5" fill="#f59e0b"/><text x="916" y="78">Position cap per person</text>
    <rect x="878" y="98" width="194" height="34" rx="8" fill="#fff" stroke="#e0e7ff"/><rect x="886" y="105" width="20" height="20" rx="5" fill="#ef4444"/><text x="916" y="120">Automatic trailing stop</text>
    <rect x="878" y="140" width="194" height="34" rx="8" fill="#fff" stroke="#e0e7ff"/><rect x="886" y="147" width="20" height="20" rx="5" fill="#8b5cf6"/><text x="916" y="162">1 % risk budget (ATR)</text>
    <rect x="878" y="182" width="194" height="34" rx="8" fill="#fff" stroke="#e0e7ff"/><rect x="886" y="189" width="20" height="20" rx="5" fill="#0ea5e9"/><text x="916" y="204">Half size in a correction</text>
    <rect x="878" y="224" width="194" height="34" rx="8" fill="#fff" stroke="#e0e7ff"/><rect x="886" y="231" width="20" height="20" rx="5" fill="#10b981"/><text x="916" y="246">Wait for LTCG · exit load</text>
  </g>
  <text x="975" y="294" font-size="11.5" fill="#4338ca" text-anchor="middle">E39 Sizing · E22 Tax timing</text>

  <!-- risk → AI -->
  <path d="M1088 150 H1150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ak)"/>

  <!-- ============ ⑤ AI REVIEW (the manager) ============ -->
  <text x="1160" y="28" font-size="15" font-weight="700" fill="#0f172a">⑤ AI second opinion</text>
  <g filter="url(#sh)"><rect x="1154" y="40" width="226" height="236" rx="14" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.5"/></g>
  <circle cx="1267" cy="88" r="30" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="1267" y="99" font-size="30" text-anchor="middle">🤖</text>
  <text x="1267" y="142" font-size="15" font-weight="800" fill="#831843" text-anchor="middle">AI reviewers (E24)</text>
  <text x="1267" y="162" font-size="11.5" fill="#9d174d" text-anchor="middle">Claude · Gemini · OpenAI</text>
  <text x="1267" y="178" font-size="11.5" fill="#9d174d" text-anchor="middle">Groq · Cloudflare · Ollama</text>
  <g font-size="11.5" font-weight="700">
    <rect x="1170" y="194" width="60" height="24" rx="12" fill="#dcfce7"/><text x="1200" y="210" text-anchor="middle" fill="#166534">Agree</text>
    <rect x="1236" y="194" width="66" height="24" rx="12" fill="#fef3c7"/><text x="1269" y="210" text-anchor="middle" fill="#92400e">Caution</text>
    <rect x="1308" y="194" width="62" height="24" rx="12" fill="#fee2e2"/><text x="1339" y="210" text-anchor="middle" fill="#991b1b">Disagree</text>
  </g>
  <text x="1267" y="240" font-size="11" fill="#9d174d" text-anchor="middle">can soften a call —</text>
  <text x="1267" y="256" font-size="11" fill="#9d174d" text-anchor="middle">never start a trade</text>

  <!-- AI → you -->
  <path d="M1267 276 V440" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ak)"/>
  <text x="1280" y="340" font-size="12.5" font-weight="600" fill="#475569">Verdict</text>
  <text x="1280" y="356" font-size="12.5" font-weight="600" fill="#475569">+ confidence</text>
  <text x="1280" y="372" font-size="12.5" font-weight="600" fill="#475569">+ what to do</text>

  <!-- ============ ⑥ YOU DECIDE ============ -->
  <g filter="url(#sh)"><rect x="1060" y="446" width="320" height="100" rx="16" fill="url(#gBlue)"/></g>
  <circle cx="1112" cy="496" r="26" fill="#ffffff" fill-opacity="0.2" stroke="#fff" stroke-width="2"/>
  <text x="1112" y="506" font-size="26" text-anchor="middle">✅</text>
  <text x="1150" y="490" font-size="22" font-weight="800" fill="#fff">⑥ You decide</text>
  <text x="1150" y="512" font-size="12" fill="#dbeafe">Accept → Shadow portfolio (E37)</text>
  <text x="1150" y="530" font-size="12" fill="#dbeafe">real orders: Phase 3, only with your OK</text>

  <!-- scorecard loop -->
  <path d="M1220 546 V620 H792 V330 H774" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ak)"/>
  <rect x="820" y="606" width="290" height="28" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="965" y="625" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">📊 Scorecard (E38) grades every call vs NIFTY</text>

  <!-- legend -->
  <g filter="url(#sh)"><rect x="812" y="330" width="226" height="226" rx="12" fill="#f8fafc" stroke="#e2e8f0"/></g>
  <text x="826" y="354" font-size="13" font-weight="800" fill="#0f172a">Who does what</text>
  <g font-size="11.5" fill="#334155">
    <text x="826" y="378"><tspan font-weight="700">Data in:</tspan> prices, fundamentals,</text>
    <text x="826" y="394">your statements, market mood</text>
    <text x="826" y="416"><tspan font-weight="700">Analysis:</tspan> scores and splits the</text>
    <text x="826" y="432">evidence into strengths / warnings</text>
    <text x="826" y="454"><tspan font-weight="700">Rulebook:</tspan> first matching rule</text>
    <text x="826" y="470">wins — versioned and tested</text>
    <text x="826" y="492"><tspan font-weight="700">Risk &amp; tax:</tspan> sizes it, sets stops</text>
    <text x="826" y="514"><tspan font-weight="700">AI:</tspan> independent second opinion</text>
    <text x="826" y="536"><tspan font-weight="700">You:</tspan> always the final say</text>
  </g>
</svg>
