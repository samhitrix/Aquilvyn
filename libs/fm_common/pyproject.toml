[project]
name = "fm-common"
version = "0.1.0"
description = "FolioSense shared platform engines: logging, cache, rate limit, identity verification, events, db, telemetry"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32",
  "uvloop>=0.21; sys_platform != 'win32'",   # uvloop has no Windows build; asyncio is used there
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "structlog>=24.4",
  "orjson>=3.10",
  "PyJWT[crypto]>=2.10",
  "httpx>=0.28",
  "opentelemetry-api>=1.29",
  "opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
  "opentelemetry-instrumentation-redis>=0.50b0",
  "opentelemetry-instrumentation-httpx>=0.50b0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fm_common*"]
