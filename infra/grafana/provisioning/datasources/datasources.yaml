apiVersion: 1
datasources:
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:  # click a trace_id in a log line → open the trace in Tempo
        - name: trace_id
          datasourceUid: tempo
          matcherRegex: '"trace_id":"(\w+)"'
          url: "$${__value.raw}"
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        customQuery: true
        query: '{service=~".+"} |= "$${__trace.traceId}"'
