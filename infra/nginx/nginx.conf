# ======================================================================================
#  E01 API Gateway — single entry point on :8080
#  * path-based routing to each microservice, WebSocket upgrade for live prices
#  * edge rate limit (coarse DDoS shield; the per-user sliding window lives in each service)
#  * X-Real-IP / X-Request-ID propagation, security headers, body-size limits
#  * /api/v1/internal/* is never exposed publicly
# ======================================================================================
worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 16m;
  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  log_format json escape=json '{"service":"gateway","time":"$time_iso8601","request_id":"$req_id","client_ip":"$remote_addr",'
                              '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
                              '"duration_ms":$request_time,"upstream_ms":"$upstream_response_time"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  limit_req_zone  $binary_remote_addr zone=edge:20m rate=40r/s;
  limit_req_zone  $binary_remote_addr zone=auth:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status 429;

  resolver 127.0.0.11 valid=10s ipv6=off;  # Docker DNS: re-resolve so scaled replicas are picked up

  upstream identity  { server identity:8000;  keepalive 32; }
  upstream portfolio { server portfolio:8000; keepalive 32; }
  upstream market    { server market:8000;    keepalive 32; }
  upstream analytics { server analytics:8000; keepalive 32; }
  upstream advisor   { server advisor:8000;   keepalive 32; }
  upstream readiness { server readiness:8000; keepalive 16; }
  upstream dashboard { server dashboard:8000; keepalive 32; }
  upstream web       { server web:3000;       keepalive 16; }

  server {
    listen 8080;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Request-ID $req_id always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
    proxy_read_timeout 120s;

    limit_conn conn 100;

    location ^~ /api/v1/internal/ { return 404; }

    location ~ ^/api/v1/auth/(login|register|refresh) {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://identity;
    }
    location ~ ^/api/v1/(auth|household|members|audit|identity)(/|$) { limit_req zone=edge burst=80 nodelay; proxy_pass http://identity; }
    location ~ ^/api/v1/(profiles|portfolios|transactions|holdings|holding-prefs|imports|performance|groups|portfolio|tax)(/|$|\?) {
      limit_req zone=edge burst=80 nodelay; proxy_pass http://portfolio;
    }
    location ~ ^/api/v1/ws/ {
      proxy_pass http://market;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
    location ~ ^/api/v1/market(/|$)    { limit_req zone=edge burst=120 nodelay; proxy_pass http://market; }
    location ~ ^/api/v1/(analysis|analytics)(/|$)  { limit_req zone=edge burst=80 nodelay; proxy_pass http://analytics; }
    location ~ ^/api/v1/advisor(/|$)   { limit_req zone=edge burst=80 nodelay; proxy_pass http://advisor; proxy_read_timeout 300s; }
    location ~ ^/api/v1/readiness(/|$) { limit_req zone=edge burst=40 nodelay; proxy_pass http://readiness; }
    location ~ ^/api/v1/dashboard(/|$) { limit_req zone=edge burst=80 nodelay; proxy_pass http://dashboard; }

    # health of every service through the gateway (used by the anti-sleep pinger)
    location ~ ^/health/(identity|portfolio|market|analytics|advisor|dashboard|readiness)$ {
      rewrite ^/health/(.*)$ /health/ready break;
      proxy_pass http://$1:8000;
    }
    location = /health { access_log off; return 200 '{"status":"ok","service":"gateway"}'; default_type application/json; }

    location / {
      proxy_pass http://web;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
